<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إتمام الطلب · أوفرفلو برجر وبطاطس</title>
  <meta name="description" content="راجع شنطتك واطلب من أوفرفلو.">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Foodidu Business">
  <meta property="og:title" content="أوفرفلو: موقع مطعم ولوحة تحكم من تصميم فوديدو بيزنس">
  <meta property="og:description" content="نظام طلبات كامل صمّمه وبناه فوديدو بيزنس: العميل يطلب ويتابع طلبه لايف، والطلب يوصل المطبخ على لوحة التحكم لحظتها.">
  <meta property="og:url" content="https://foodidu.com/business/work/overflow/ar/checkout.html">
  <meta property="og:image" content="https://foodidu.com/business/work/overflow/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ar_EG">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <link rel="alternate" hreflang="en" href="../checkout.html">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Public+Sans:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-page="checkout" data-base="../" data-alt="../checkout.html" id="top">
<a class="skip" href="#main">انتقل للمحتوى</a>
<header class="hdr" id="hdr"></header>
<main id="main">
  <section class="banner torn"><h1 class="cap h-xl">إتمام الطلب</h1></section>
  <form class="co" id="coForm" novalidate><div id="coWrap" style="display:contents">
    <div>
      <section class="panel"><div class="panel-h"><span class="num">1</span><h2 class="cap">عايزه إزاي؟</h2></div><div class="panel-b"><div class="choice" id="coType"></div></div></section>
      <section class="panel"><div class="panel-h"><span class="num">2</span><h2 class="cap">فين وإمتى</h2></div><div class="panel-b">
        <div class="fields"><div class="field full"><label for="coBranch">الفرع</label><div class="select" style="display:block"><select id="coBranch" style="width:100%"></select></div></div>
          <div id="addrFields" class="field full" hidden><label for="coAddr">عنوان التوصيل</label><input id="coAddr" autocomplete="street-address" placeholder="العمارة، الشارع، الدور، الشقة"><span class="err">محتاجين عنوان نوصّل عليه.</span></div></div>
        <p class="opt-title" style="margin-top:20px">الوقت</p><div class="slots" id="coSlots"></div></div></section>
      <section class="panel"><div class="panel-h"><span class="num">3</span><h2 class="cap">بياناتك</h2></div><div class="panel-b"><div class="fields">
        <div class="field"><label for="coName">الاسم</label><input id="coName" autocomplete="name" placeholder="الطلب باسم مين؟"><span class="err">اكتب اسم للتيكت.</span></div>
        <div class="field"><label for="coPhone">الموبايل</label><input id="coPhone" type="tel" dir="ltr" autocomplete="tel" placeholder="01x xxxx xxxx" style="text-align:right"><span class="err">اكتب رقم موبايل نقدر نكلّمك عليه.</span></div>
        <div class="field full"><label for="coNotes">ملاحظة للطاقم <span style="color:var(--mute);font-weight:600">(اختياري)</span></label><textarea id="coNotes" maxlength="200" placeholder="حساسية، كود البوابة، مناديل زيادة…"></textarea></div></div></div></section>
      <section class="panel"><div class="panel-h"><span class="num">4</span><h2 class="cap">الدفع</h2></div><div class="panel-b"><div class="choice">
        <label><input type="radio" name="pay" value="Cash" checked><b>كاش</b><span>ادفع وانت بتستلم أو عند التوصيل</span></label>
        <label><input type="radio" name="pay" value="Card at the counter"><b>كارت</b><span>ادفع بالكارت عند الكاشير أو على الباب</span></label>
        <label><input type="radio" name="pay" value="Wallet (InstaPay)"><b>محفظة</b><span>إنستاباي أو محفظة موبايل وقت الاستلام</span></label></div>
        <p class="fine" style="text-align:right">النسخة دي من الموقع للعرض: مفيش فلوس بتتدفع، ومش هنطلب منك بيانات كارت.</p></div></section>
    </div>
    <aside class="summary"><div class="panel"><div class="panel-h"><h2 class="cap">طلبك</h2></div><ul class="drawer-list" id="coLines"></ul>
      <div class="panel-b" style="border-top:1px solid var(--line)"><div class="promo-row"><input id="promoIn" placeholder="كود الخصم" aria-label="كود الخصم"><button class="btn" type="button" id="promoApply">تطبيق</button></div><p class="promo-msg" id="promoMsg" hidden></p>
      <div id="coTotals"></div><button class="btn btn-lg btn-block" type="submit" id="placeBtn">اطلب</button><p class="fine">هتوصلك صفحة تتبع لايف أول ما تطلب.</p></div></div></aside>
  </div></form>
</main>
<footer class="ftr" id="ftr"></footer>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/site.js"></script>
</body>
</html>
