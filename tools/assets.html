<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foodidu asset generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;700&display=block">
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #eee; }
  #log { white-space: pre-wrap; font: 12px monospace; }
  #out { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  #out img { max-width: 300px; border: 1px solid #ccc; background: #fff; }
</style>
</head>
<body>
<h1>Foodidu asset generator</h1>
<p>Open via <code>perl tools/serve.pl</code> at <code>/__tools/assets.html</code>. Renders brand logos, app icons and Open Graph images and saves them into <code>static/img/</code>. Then run <code>perl tools/build.pl</code>.</p>
<button id="go">Generate all</button> <label><input type="checkbox" id="only-og"> only OG images</label>
<div id="log"></div>
<div id="out"></div>
<script>
const SUN = "#FFD15C", SUN2 = "#FFC533", INK = "#543A14", INK2 = "#6B522C", LEAF = "#4A7A1E", CREAM = "#FFF9EB", SUN4 = "#FFF1CC", LINE = "#E4CF9E";
// source logo in legacy/images, padding ratio, background. pad 0 = the logo already is a full tile.
const LOGOS = {
  "kfc":             { src: "KFC.svg",              pad: .10, bg: "#fff" },
  "pizza-hut":       { src: "Pizza Hut.svg",        pad: .12, bg: "#fff" },
  "rabbit":          { src: "Rabbit.png",           pad: .12, bg: "#161616" },
  "breadfast":       { src: "Breadfast.svg",        pad: .16, bg: "#fff" },
  "senem":           { src: "senem.webp",           pad: .06, bg: "#fff" },
  "abu-auf":         { src: "abu_auf.svg",          pad: .08, bg: "#fff" },
  "noon":            { src: "noon-logo.png",        pad: 0,   bg: "#FEEE00" },
  "mini-beirut":     { src: "MiniBeirut.svg",       pad: .10, bg: "#fff" },
  "just-smash":      { src: "just_smash.svg",       pad: 0,   bg: "#fff" },
  "my-buffalo":      { src: "mybuffalo.svg",        pad: .04, bg: "#fff" },
  "butchers-burger": { src: "butcher'sburger.svg",  pad: 0,   bg: "#fff" },
  "willys-kitchen":  { src: "willys-kitchen.svg",   pad: .1,  bg: "#fff", from: "/__tools/logo-src/" },
  "bazooka":         { src: "bazooka.png",          pad: .08, bg: "#111", from: "/__tools/logo-src/" },
  "talabat-mart":    { src: "talabat-mart.svg",     pad: .08, bg: "#fff", from: "/__tools/logo-src/" },
  "waffarha":        { src: "waffarha.svg",         pad: .1,  bg: "#fff", from: "/__tools/logo-src/" },
  "iherb":           { src: "iherb.svg",            pad: .16, bg: "#458500", from: "/__tools/logo-src/" }
};
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = () => rej(new Error("load " + src)); i.src = src; });
const canvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const blob = (c, type, q) => new Promise((res) => c.toBlob(res, type, q));
async function save(path, c, type = "image/png", q) {
  const b = await blob(c, type, q);
  const r = await fetch("/__save?path=" + encodeURIComponent(path), { method: "POST", body: b });
  log((await r.text()));
  const img = new Image(); img.src = URL.createObjectURL(b); img.title = path; document.getElementById("out").appendChild(img);
}
function fit(ctx, img, x, y, w, h, cover) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = cover ? Math.max(w / iw, h / ih) : Math.min(w / iw, h / ih);
  const dw = iw * s, dh = ih * s;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

async function logos() {
  for (const [key, o] of Object.entries(LOGOS)) {
    const S = 384, c = canvas(S, S), x = c.getContext("2d");   // 384px: sharp on 3x phone screens
    if (o.text) {   // no official logo file: the brand name as a clean text tile
      x.fillStyle = o.bg || "#fff"; x.fillRect(0, 0, S, S);
      let size = 52; x.font = `700 ${size}px 'Readex Pro'`;
      while (x.measureText(o.text).width > S * .8 && size > 20) { size -= 2; x.font = `700 ${size}px 'Readex Pro'`; }
      x.fillStyle = o.color || INK; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(o.text, S / 2, S / 2 + 2);
      x.fillStyle = o.color || INK; x.globalAlpha = .9; x.fillRect(S * .3, S / 2 + size * .62, S * .4, 5); x.globalAlpha = 1;
      await save(`static/img/brands/${key}.webp`, c, "image/webp", .92);
      continue;
    }
    let img = await load((o.from || "/__legacy/images/") + encodeURIComponent(o.src));
    let bg = o.bg;
    if (o.crop) {   // cut the logo out of a bigger picture (e.g. an ad the owner sent)
      const [sx, sy, sw, sh] = o.crop, cc = canvas(sw, sh), cx = cc.getContext("2d");
      cx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      if (bg === "auto") { const d = cx.getImageData(2, 2, 1, 1).data; bg = `rgb(${d[0]},${d[1]},${d[2]})`; }
      img = cc;
    }
    x.fillStyle = bg; x.fillRect(0, 0, S, S);
    const p = S * o.pad;
    fit(x, img, p, p, S - 2 * p, S - 2 * p, o.pad === 0);
    await save(`static/img/brands/${key}.webp`, c, "image/webp", .95);
  }
}

// App-icon style: brand green square (like the Google Play icon) with the Foodidu logo centred.
async function icons(logo, pattern) {
  const make = async (S, path, scale) => {
    const c = canvas(S, S), x = c.getContext("2d");
    x.fillStyle = "#8CC24A"; x.fillRect(0, 0, S, S);
    if (S >= 128) { x.globalAlpha = .25; x.globalCompositeOperation = "soft-light"; for (let py = 0; py < S; py += S * 1.1) for (let px = 0; px < S; px += S / 2) x.drawImage(pattern, px, py, S / 2, S * 1.08); x.globalAlpha = 1; x.globalCompositeOperation = "source-over"; }
    const w = S * scale, h = w * 304 / 767;
    x.drawImage(logo, (S - w) / 2, (S - h) / 2, w, h);
    await save(path, c, "image/png");
  };
  await make(180, "static/img/apple-touch-icon.png", .84);
  await make(192, "static/img/icon-192.png", .84);
  await make(512, "static/img/icon-512.png", .84);
  await make(512, "static/img/foodidu-logo-512.png", .84);
  await make(32, "static/img/favicon-32.png", 1);
}

// ---------- Open Graph ----------
function wrap(ctx, text, maxW) {
  const words = text.split(" "); const lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function ticketArt(ctx, b, lang, logo, x, y, w, rot) {
  const h = 330, stub = 96;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = "rgba(84,58,20,.35)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.fillStyle = "#fff"; rr(ctx, 0, 0, w, h, 30); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = SUN4; rr(ctx, 0, h - stub, w, stub, [0, 0, 30, 30]); ctx.fill();
  ctx.fillStyle = SUN;
  for (const cx of [0, w]) { ctx.beginPath(); ctx.arc(cx, h - stub, 18, 0, Math.PI * 2); ctx.fill(); }
  ctx.setLineDash([10, 8]); ctx.strokeStyle = LINE; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(26, h - stub); ctx.lineTo(w - 26, h - stub); ctx.stroke(); ctx.setLineDash([]);
  const rtl = lang === "ar";
  ctx.direction = rtl ? "rtl" : "ltr";
  const lx = rtl ? w - 30 - 90 : 30;
  ctx.save(); rr(ctx, lx, 28, 90, 90, 22); ctx.clip(); ctx.drawImage(logo, lx, 28, 90, 90); ctx.restore();
  ctx.strokeStyle = "#EFDFBA"; ctx.lineWidth = 2; rr(ctx, lx, 28, 90, 90, 22); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = rtl ? "right" : "left";
  const tx = rtl ? w - 30 - 90 - 20 : 30 + 90 + 20;
  ctx.font = "700 34px 'Readex Pro'"; ctx.fillText(b.name[lang], tx, 72);
  ctx.font = "400 24px 'Readex Pro'"; ctx.fillStyle = INK2; ctx.fillText(b.cat, tx, 106);
  const [big, small] = b.badge[lang];
  ctx.font = "96px Lalezar"; ctx.fillStyle = INK;
  const bx = rtl ? w - 30 : 30;
  if (rtl) { ctx.font = "44px Lalezar"; ctx.fillStyle = LEAF; ctx.fillText(small, bx, 228); const sw = ctx.measureText(small).width; ctx.font = "96px Lalezar"; ctx.fillStyle = INK; ctx.fillText(big, bx - sw - 14, 228); }
  else { ctx.fillText(big, bx, 228); const bw = ctx.measureText(big).width; ctx.font = "44px Lalezar"; ctx.fillStyle = LEAF; ctx.fillText(small, bx + bw + 14, 228); }
  const cy = h - stub + 18, ch = 60;
  if (b.tag) {   // restaurant offers: a solid "save up to" pill instead of a code box
    ctx.fillStyle = INK; rr(ctx, 26, cy, w - 52, ch, 14); ctx.fill();
    ctx.textAlign = "center"; ctx.direction = rtl ? "rtl" : "ltr"; ctx.font = "700 28px 'Readex Pro'"; ctx.fillStyle = SUN;
    ctx.fillText(b.tag, w / 2, cy + 40); ctx.restore(); return;
  }
  // code box
  ctx.setLineDash([9, 6]); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.fillStyle = "#fff";
  rr(ctx, 26, cy, w - 52, ch, 14); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = INK; rr(ctx, w - 26 - 150, cy, 150, ch, [0, 14, 14, 0]); ctx.fill();
  ctx.direction = "ltr"; ctx.textAlign = "center";
  ctx.font = "700 30px ui-monospace, Consolas, monospace"; ctx.fillStyle = INK; ctx.fillText(b.code, 26 + (w - 52 - 150) / 2, cy + 41);
  ctx.font = "700 26px 'Readex Pro'"; ctx.fillStyle = SUN; ctx.direction = rtl ? "rtl" : "ltr"; ctx.fillText(rtl ? "انسخ" : "Copy", w - 26 - 75, cy + 40);
  ctx.restore();
}
async function og(pattern, face, data) {
  const logos = {};
  for (const b of data.brands) logos[b.key] = await load(`/__static/img/brands/${b.logo}`);
  const rests = (await (await fetch("/__data/restaurant-offers.json")).json()).restaurants || [];
  for (const r of rests) logos[r.key] = await load(`/__static/img/brands/${r.logo}`);
  const CAT = data.categories;
  const copy = {
    en: {
      home: ["Every bite, a better price.", "Promo codes for KFC, Pizza Hut, Rabbit, noon and more in Egypt & the GCC."],
      codes: ["All promo codes in one place", "Restaurants, grocery apps and online shopping in Egypt & the GCC."],
      partners: ["Partner with Foodidu", "Put your restaurant's promo code in front of people about to order."],
      "day-deals": ["Weekly day deals", "Offers that come back every week, like the KFC Tuesday offer."],
      brand: (b) => [b.moreCodes ? `${b.name.en} promo codes` : `${b.name.en} promo code`, [b.offer.en, ...(b.moreCodes || []).map((x) => x.offer.en)].join(" · ")]
    },
    ar: {
      home: ["كل أكلة… بسعر أحلى.", "أكواد خصم كنتاكي وبيتزا هت ورابيت ونون وغيرها في مصر والخليج."],
      codes: ["كل أكواد الخصم في مكان واحد", "مطاعم وتطبيقات بقالة وتسوق أونلاين في مصر والخليج."],
      partners: ["انضم لشركاء Foodidu", "اعرض كود خصم مطعمك أمام أشخاص على وشك الطلب."],
      "day-deals": ["عروض الأيام", "عروض تتكرر كل أسبوع، مثل عرض كنتاكي يوم الثلاثاء."],
      brand: (b) => [b.moreCodes ? `أكواد خصم ${b.name.ar}` : `كود خصم ${b.name.ar}`, [b.offer.ar, ...(b.moreCodes || []).map((x) => x.offer.ar)].join(" · ")]
    }
  };
  const jobs = [];
  for (const lang of ["en", "ar"]) {
    for (const k of ["home", "codes", "partners"]) jobs.push({ lang, file: `${k}-${lang}`, text: copy[lang][k], brands: ["pizza-hut", "kfc"] });
    jobs.push({ lang, file: `day-deals-${lang}`, text: copy[lang]["day-deals"], brands: ["kfc"] });
    for (const b of data.brands) jobs.push({ lang, file: `${b.key}-${lang}`, text: copy[lang].brand(b), items: [b, ...(b.moreCodes || []).map((x) => ({ ...b, code: x.code, badge: x.badge }))] });
    for (const r of rests) {
      const min = Math.min(...r.offers.map((o) => o.price));
      const save = Math.max(...r.offers.map((o) => Math.round((1 - o.price / o.was) * 100)));
      const n = r.offers.length;
      const text = lang === "ar"
        ? [`عروض ${r.name.ar}`, `${n <= 10 ? n + " عروض" : n + " عرضاً"} تبدأ من ${min} جنيه، ووفّر حتى ${save}% من سعر المنيو.`]
        : [`${r.name.en} offers`, `${n} offers from ${min} EGP, saving up to ${save}% on the menu price.`];
      const badge = { en: [String(min), "EGP"], ar: [`${min} جنيه`, "من"] };
      jobs.push({ lang, file: `${r.key}-${lang}`, text, items: [{ ...r, badge, tag: lang === "ar" ? `وفّر حتى ${save}%` : `Save up to ${save}%` }] });
    }
  }
  const byKey = Object.fromEntries(data.brands.map((b) => [b.key, b]));
  for (const j of jobs) {
    const W = 1200, H = 630, c = canvas(W, H), x = c.getContext("2d");
    const rtl = j.lang === "ar";
    x.fillStyle = SUN; x.fillRect(0, 0, W, H);
    x.globalAlpha = .9; for (let py = 0; py < H; py += 406) for (let px = 0; px < W; px += 187) x.drawImage(pattern, px, py - 60, 187, 406); x.globalAlpha = 1;
    // scallop bottom strip
    x.fillStyle = CREAM; x.fillRect(0, H - 22, W, 22);
    x.fillStyle = SUN; for (let sx = 12; sx < W + 24; sx += 24) { x.beginPath(); x.arc(sx, H - 22, 11, 0, Math.PI); x.fill(); }
    // text column
    const colW = 600, colX = rtl ? W - 64 : 64;
    x.direction = rtl ? "rtl" : "ltr"; x.textAlign = rtl ? "right" : "left";
    const lw = 200, lh0 = lw * 304 / 767, fx = rtl ? W - 64 - lw : 64;
    x.drawImage(face, fx, 36, lw, lh0);
    x.fillStyle = INK;
    let size = 92; x.font = `${size}px Lalezar`;
    let lines = wrap(x, j.text[0], colW);
    while (lines.length > 3 && size > 60) { size -= 6; x.font = `${size}px Lalezar`; lines = wrap(x, j.text[0], colW); }
    const lh = rtl ? size * 1.28 : size * 1.02;
    let y = 150 + size;
    for (const ln of lines) { x.fillText(ln, colX, y); y += lh; }
    x.font = "400 30px 'Readex Pro'"; x.fillStyle = INK2;
    y += 6; for (const ln of wrap(x, j.text[1], colW).slice(0, 3)) { x.fillText(ln, colX, y); y += 44; }
    // tickets
    const tw = 440, tx = rtl ? 70 : W - 70 - tw;
    const list = j.items || j.brands.map((k) => byKey[k]);   // a brand with 2 codes shows 2 tickets
    if (list.length === 2) {
      ticketArt(x, { ...list[0], cat: CAT[list[0].category][j.lang] }, j.lang, logos[list[0].key], tx - (rtl ? -30 : 30), 70, tw, rtl ? .07 : -.07);
      ticketArt(x, { ...list[1], cat: CAT[list[1].category][j.lang] }, j.lang, logos[list[1].key], tx + (rtl ? -20 : 20), 205, tw, rtl ? -.04 : .04);
    } else {
      ticketArt(x, { ...list[0], cat: CAT[list[0].category][j.lang] }, j.lang, logos[list[0].key], tx, 140, tw, rtl ? .05 : -.05);
    }
    await save(`static/img/og/${j.file}.png`, c, "image/png");
  }
}

document.getElementById("go").onclick = async () => {
  try {
    await document.fonts.load("92px Lalezar"); await document.fonts.load("700 30px 'Readex Pro'"); await document.fonts.load("400 30px 'Readex Pro'");
    await document.fonts.load("700 30px 'Readex Pro'", "كود خصم"); await document.fonts.load("92px Lalezar", "كود خصم");
    const data = await (await fetch("/__data/brands.json")).json();
    const face = await load("/__static/img/foodidu-logo.svg");
    const pattern = await load("/__static/img/pattern.svg");
    if (!document.getElementById("only-og").checked) { await logos(); await icons(face, pattern); }
    await og(pattern, face, data);
    log("DONE");
  } catch (e) { log("ERROR " + e.message); }
};
</script>
</body>
</html>
