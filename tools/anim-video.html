<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foodidu Business animation: preview and video</title>
<link rel="stylesheet" href="/__static/css/site.css">
<style>
  body { padding: 20px; background: #fff; font-family: "Readex Pro", system-ui, sans-serif; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  canvas { width: 540px; max-width: 100%; height: auto; border: 1px solid #ddd; }
  #log { white-space: pre-wrap; font: 12px/1.5 monospace; }
</style>
</head>
<body>
<!-- Dev-only: http://localhost:5000/__tools/anim-video.html
     Preview the 30 s Foodidu Business explainer (static/js/biz-anim.js, the hero of /business/) frame by frame, and make an MP4 of it for social media:
     every frame is drawn and encoded to H.264 with WebCodecs (frame by frame, so a busy or hidden tab can't drop frames),
     then written into an MP4 file here (no libraries), saved to banners/business/foodidu-business-<lang>.mp4. -->
<h1>Foodidu Business animation</h1>
<div class="row">
  <label>Language <select id="lang"><option value="ar">العربية</option><option value="en">English</option></select></label>
  <input id="seek" type="range" min="0" max="30" step="0.1" value="0" style="width:420px"> <span id="tval">0.0 s</span>
  <button id="sheet">Contact sheet</button> <button id="mp4">Make the MP4</button>
</div>
<canvas id="cv" data-lang="ar"></canvas>
<pre id="log"></pre>
<script src="/__static/js/biz-anim.js"></script>
<script>
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
const BG = "#FFF9EB";
let cv = document.getElementById("cv"), anim = FoodiduBizAnim.Anim(cv);
const seek = document.getElementById("seek");
const show = () => { anim.draw(+seek.value, BG); document.getElementById("tval").textContent = (+seek.value).toFixed(1) + " s"; };
seek.oninput = show;
document.getElementById("lang").onchange = (e) => { cv.setAttribute("data-lang", e.target.value); anim = FoodiduBizAnim.Anim(cv); show(); };
document.fonts.load("54px Lalezar", "Foodidu").then(() => document.fonts.load("700 40px 'Readex Pro'", "منيو menu")).then(() => document.fonts.load("500 24px 'Readex Pro'", "منيو menu")).then(show);
// all the scenes on one image, to check the layout
document.getElementById("sheet").onclick = async () => {
  const lang = document.getElementById("lang").value, ts = [1.5, 3.4, 5, 7.6, 10, 13.4, 16.2, 19.4, 21.5, 24.6, 26.6, 29.2];
  const sh = document.createElement("canvas"); sh.width = 1440; sh.height = 1080; const sx = sh.getContext("2d");
  ts.forEach((t, i) => { anim.draw(t, BG); sx.drawImage(cv, (i % 4) * 360, Math.floor(i / 4) * 360, 360, 360); sx.fillStyle = "#000"; sx.font = "20px monospace"; sx.fillText(t + "s", (i % 4) * 360 + 8, Math.floor(i / 4) * 360 + 22); });
  const b = await new Promise((r) => sh.toBlob(r, "image/png"));
  log(await (await fetch("/__save?path=" + encodeURIComponent(`banners/business/_sheet-${lang}.png`), { method: "POST", body: b })).text());
};

// ---------- a small MP4 writer: one H.264 video track, all samples in one chunk, moov before mdat ----------
const enc = new TextEncoder();
function cat(parts) { const n = parts.reduce((s, p) => s + p.length, 0), o = new Uint8Array(n); let i = 0; for (const p of parts) { o.set(p, i); i += p.length; } return o; }
function u8(...v) { return new Uint8Array(v); }
function u16(v) { return u8(v >> 8 & 255, v & 255); }
function u32(v) { return u8(v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255); }
function box(type, ...parts) { const body = cat(parts); return cat([u32(body.length + 8), enc.encode(type), body]); }
function full(type, version, flags, ...parts) { return box(type, u8(version, flags >> 16 & 255, flags >> 8 & 255, flags & 255), ...parts); }
const MATRIX = cat([u32(0x10000), u32(0), u32(0), u32(0), u32(0x10000), u32(0), u32(0), u32(0), u32(0x40000000)]);
function mp4({ width, height, fps, avcC, samples }) {   // samples: [{ data: Uint8Array, key: bool }]
  const n = samples.length, durMs = Math.round(n * 1000 / fps);
  const moov = (offset) => box("moov",
    full("mvhd", 0, 0, u32(0), u32(0), u32(1000), u32(durMs), u32(0x10000), u16(0x100), u16(0), u32(0), u32(0), MATRIX, new Uint8Array(24), u32(2)),
    box("trak",
      full("tkhd", 0, 3, u32(0), u32(0), u32(1), u32(0), u32(durMs), u32(0), u32(0), u16(0), u16(0), u16(0), u16(0), MATRIX, u32(width << 16), u32(height << 16)),
      box("mdia",
        full("mdhd", 0, 0, u32(0), u32(0), u32(fps), u32(n), u16(0x55c4), u16(0)),
        full("hdlr", 0, 0, u32(0), enc.encode("vide"), new Uint8Array(12), enc.encode("Foodidu video\0")),
        box("minf",
          full("vmhd", 0, 1, u16(0), u16(0), u16(0), u16(0)),
          box("dinf", full("dref", 0, 0, u32(1), full("url ", 0, 1))),
          box("stbl",
            full("stsd", 0, 0, u32(1), box("avc1", new Uint8Array(6), u16(1), u16(0), u16(0), new Uint8Array(12), u16(width), u16(height),
              u32(0x480000), u32(0x480000), u32(0), u16(1), new Uint8Array(32), u16(0x18), u16(0xffff), box("avcC", avcC))),
            full("stts", 0, 0, u32(1), u32(n), u32(1)),
            full("stss", 0, 0, u32(samples.filter((s) => s.key).length), ...samples.map((s, i) => s.key ? u32(i + 1) : null).filter(Boolean)),
            full("stsc", 0, 0, u32(1), u32(1), u32(n), u32(1)),
            full("stsz", 0, 0, u32(0), u32(n), ...samples.map((s) => u32(s.data.length))),
            full("stco", 0, 0, u32(1), u32(offset)))))));
  const ftyp = box("ftyp", enc.encode("isom"), u32(0x200), enc.encode("isomiso2avc1mp41"));
  const size = moov(0).length, data = cat(samples.map((s) => s.data));
  return cat([ftyp, moov(ftyp.length + size + 8), u32(data.length + 8), enc.encode("mdat"), data]);
}

document.getElementById("mp4").onclick = async () => {
  const lang = document.getElementById("lang").value, W = 1080, H = 1080, FPS = 30, N = 30 * FPS;
  const config = { codec: "avc1.420028", width: W, height: H, bitrate: 5e6, framerate: FPS, avc: { format: "avc" } };   // Baseline 4.0: no B-frames
  const ok = await VideoEncoder.isConfigSupported(config);
  if (!ok.supported) { log("H.264 encoding not supported here"); return; }
  const samples = []; let avcC = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) avcC = new Uint8Array(meta.decoderConfig.description);
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d); samples.push({ data: d, key: chunk.type === "key" });
    },
    error: (e) => log("encoder error " + e.message)
  });
  encoder.configure(config);
  log(`encoding ${lang}: ${N} frames…`);
  for (let i = 0; i < N; i++) {
    anim.draw(i / FPS, BG);
    const frame = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    encoder.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
    frame.close();
    while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
    if (i % 150 === 0) log(`  frame ${i}`);
  }
  await encoder.flush(); encoder.close();
  if (!avcC) { log("no avcC from the encoder"); return; }
  const file = mp4({ width: W, height: H, fps: FPS, avcC, samples });
  const path = `banners/business/foodidu-business-${lang}.mp4`;
  const r = await fetch("/__save?path=" + encodeURIComponent(path), { method: "POST", body: file });
  log(await r.text() + ` (${samples.length} frames, ${samples.filter((s) => s.key).length} key frames)`);
};
</script>
</body>
</html>
